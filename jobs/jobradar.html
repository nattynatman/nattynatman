<html lang="en">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{font-family:'Inter',system-ui,sans-serif}
.card{transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px -4px rgba(99,102,241,.15);transform:translateY(-1px)}
.chip{cursor:pointer;padding:.3rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;transition:all .12s;border:1.5px solid transparent}
.chip.on{background:#6366f1;color:#fff;border-color:#6366f1}
.chip.off{background:#f1f5f9;color:#475569;border-color:transparent}
.chip.off:hover{background:#e0e7ff;color:#4338ca}
.tag{font-size:.67rem;font-weight:600;padding:.18rem .52rem;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.bar{height:4px;border-radius:2px;background:#e0e7ff}
.fill{height:4px;border-radius:2px;transition:width .5s ease}
.hi{background:linear-gradient(90deg,#6366f1,#a855f7)}
.md{background:linear-gradient(90deg,#22d3ee,#6366f1)}
.lo{background:linear-gradient(90deg,#94a3b8,#cbd5e1)}
.badge-startup{background:#fef3c7;color:#92400e}
.badge-scaleup{background:#dcfce7;color:#166534}
.badge-enterprise{background:#e0f2fe;color:#075985}
input:focus{outline:2px solid #6366f1;outline-offset:0}
select:focus{outline:2px solid #6366f1;outline-offset:0}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
</style>
</head>

    </div>

      <option value="score">Best match</option>
      <option value="date">Most recent</option>
      <option value="salary">Highest salary</option>
    </select>

    <span id="count" class="text-sm text-slate-400 flex-shrink-0 w-20 text-right"></span>
  </div>
</header>

<!-- LAYOUT -->
<div class="max-w-6xl mx-auto px-5 py-5 flex gap-5">

      </div>
    </div>

    <!-- Min score -->

    </div>

  </aside>

  <!-- JOB LIST -->
  <main class="flex-1 min-w-0 space-y-3" id="list"></main>

</div>

];

// ── State ──────────────────────────────────────────────────────────────────
const state = { q:'', role:null, type:null, loc:'all', score:0, sort:'score' };

const ROLES = [
  { key:'pmm',     label:'Product Marketing', tags:['product marketing'] },
  { key:'growth',  label:'Growth',            tags:['growth marketing','growth'] },
  { key:'b2b',     label:'B2B / Demand Gen',  tags:['b2b marketing','b2b','demand generation'] },
  { key:'content', label:'Content / Brand',   tags:['content marketing','brand marketing'] },
  { key:'partner', label:'Partner / Field',   tags:['partner marketing','field marketing'] },
  { key:'ecomm',   label:'Ecommerce',         tags:['ecommerce marketing','ecommerce'] },
];

const TYPES = [
  { key:'startup',    label:'Startup' },
  { key:'scaleup',    label:'Scale-up' },
  { key:'enterprise', label:'Enterprise' },
];

// ── Boot ───────────────────────────────────────────────────────────────────
function init() {
  // Role chips
  const rc = document.getElementById('role-chips');
  rc.innerHTML = `<button class="chip on text-left" id="role-all" onclick="setRole(null)">All roles</button>` +
    ROLES.map(r => `<button class="chip off text-left" id="role-${r.key}" onclick="setRole('${r.key}')">${r.label}</button>`).join('');

  // Type chips
  const tc = document.getElementById('type-chips');
  tc.innerHTML = `<button class="chip on text-left" id="type-all" onclick="setType(null)">All stages</button>` +
    TYPES.map(t => `<button class="chip off text-left" id="type-${t.key}" onclick="setType('${t.key}')">${t.label}</button>`).join('');

  document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
  document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });

  render();
}

// ── Filter + sort ──────────────────────────────────────────────────────────
function filtered() {
  return JOBS.filter(j => {
    if (state.loc === 'remote' && !j.remote) return false;
    if (state.type && j.type !== state.type) return false;
    if (j.score < state.score) return false;
    if (state.role) {
      const rDef = ROLES.find(r => r.key === state.role);
      if (rDef && !rDef.tags.some(t => j.tags.includes(t) || j.title.toLowerCase().includes(t)))
        return false;
    }
    if (state.q) {
      const ql = state.q.toLowerCase();
      const hay = `${j.title} ${j.company} ${j.location} ${j.tags.join(' ')} ${j.desc}`.toLowerCase();
      if (!ql.split(' ').every(w => hay.includes(w))) return false;
    }
    return true;
  }).sort((a, b) => {
    if (state.sort === 'date') return a.days - b.days;
    if (state.sort === 'salary') {
      const sa = parseInt((a.salary||'0').replace(/[^0-9]/g,'').slice(-6)) || 0;
      const sb = parseInt((b.salary||'0').replace(/[^0-9]/g,'').slice(-6)) || 0;
      return sb - sa;
    }
    return b.score - a.score;
  });
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const jobs = filtered();
  document.getElementById('count').textContent = `${jobs.length} of ${JOBS.length}`;
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  if (!jobs.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    empty.classList.add('flex');
    return;
  }
  empty.classList.add('hidden');
  empty.classList.remove('flex');

  list.innerHTML = jobs.map(card).join('');
}

function card(j) {
  const max = 16, pct = Math.min(100, (j.score / max) * 100);
  const cls = j.score >= 12 ? 'hi' : j.score >= 8 ? 'md' : 'lo';
  const typeBadge = {startup:'badge-startup',scaleup:'badge-scaleup',enterprise:'badge-enterprise'}[j.type] || '';
  const typeLabel = {startup:'Startup',scaleup:'Scale-up',enterprise:'Enterprise'}[j.type] || j.type;
  const ago = j.days === 0 ? 'Today' : j.days === 1 ? '1d ago' : `${j.days}d ago`;
  const remotePill = j.remote ? `<span class="tag bg-violet-50 text-violet-700">Remote</span>` : '';
  const salaryPill = j.salary ? `<span class="text-xs font-semibold text-emerald-600">${esc(j.salary)}</span>` : '';
  const tagPills = j.tags.slice(0,4).map(t => `<span class="tag bg-slate-100 text-slate-500">${esc(t)}</span>`).join('');
  const initial = j.company.charAt(0);

  return `
<a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer"
   class="card block bg-white rounded-xl border border-slate-100 p-5 cursor-pointer group">
  <div class="flex gap-3 items-start">
    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center text-slate-500 font-bold text-sm flex-shrink-0 group-hover:from-indigo-50 group-hover:to-purple-50 group-hover:text-indigo-600 transition">${esc(initial)}</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <p class="font-semibold text-slate-800 text-sm leading-snug group-hover:text-indigo-600 transition">${esc(j.title)}</p>
          <p class="text-xs text-slate-500 mt-0.5">${esc(j.company)} &middot; ${esc(j.location)}</p>
        </div>
        <div class="flex-shrink-0 flex flex-col items-end gap-1">
          <span class="tag ${typeBadge}">${typeLabel}</span>
          <span class="text-[10px] text-slate-400">${ago}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3 mb-2">
    <div class="flex justify-between mb-1">
      <span class="text-[10px] text-slate-400 uppercase tracking-wide">Match</span>
      <span class="text-[10px] font-semibold text-slate-500">${j.score.toFixed(1)} / 16</span>
    </div>
    <div class="bar"><div class="fill ${cls}" style="width:${pct}%"></div></div>
  </div>

  <p class="text-xs text-slate-500 leading-relaxed line-clamp-2 mb-3">${esc(j.desc)}</p>

  <div class="flex items-center gap-1.5 flex-wrap">
    ${remotePill}
    ${salaryPill}
    ${tagPills}
    <span class="ml-auto text-xs font-medium text-indigo-500 group-hover:text-indigo-700 transition flex items-center gap-1">
      View →
    </span>
  </div>
</a>`;
}

// ── Controls ───────────────────────────────────────────────────────────────
function setRole(key) {
  state.role = key;
  document.querySelectorAll('[id^="role-"]').forEach(el => el.classList.replace('on','off'));
  document.getElementById(key ? `role-${key}` : 'role-all').classList.replace('off','on');
  render();
}
function setType(key) {
  state.type = key;
  document.querySelectorAll('[id^="type-"]').forEach(el => el.classList.replace('on','off'));
  document.getElementById(key ? `type-${key}` : 'type-all').classList.replace('off','on');
  render();
}
function setLoc(val) {
  state.loc = val;
  ['all','remote'].forEach(v => document.getElementById(`loc-${v}`).classList.replace('on','off'));
  document.getElementById(`loc-${val}`).classList.replace('off','on');
  render();
}
function setScore(val) {
  state.score = val;
  [0,3,6,9].forEach(v => document.getElementById(`sc-${v}`).classList.replace('on','off'));
  document.getElementById(`sc-${val}`).classList.replace('off','on');
  render();
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
